[server]
address = "127.0.0.1"
port = 8501
headless = true
enableCORS = true
enableXsrfProtection = true
runOnSave = true
fileWatcherType = "poll"

[browser]
serverAddress = "localhost"
serverPort = 8501
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#007337"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F6F3"
textColor = "#303B34"
font = "Arial, Helvetica, sans-serif"
baseRadius = "0.35rem"

[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[ui]
hideTopBar = true
